name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'

      - run: npm ci

      - run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js missing" && exit 1)
          test -f dist/build-catalog.js || (echo "ERROR: dist/build-catalog.js missing" && exit 1)

      - name: Verify tests pass
        run: npm test

      - name: Scope package for GitHub npm registry
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@kgt24k/mcp-tool-search';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '
');
          "

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
