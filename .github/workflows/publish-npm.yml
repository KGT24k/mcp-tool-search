name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || (echo "ERROR: dist/index.js missing" && exit 1)
          test -f dist/build-catalog.js || (echo "ERROR: dist/build-catalog.js missing" && exit 1)

      - name: Verify tests pass
        run: npm test

      - name: Check if version already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view mcp-tool-search@$VERSION version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm — skipping upload"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm — will upload"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
